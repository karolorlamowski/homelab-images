name: Build Frigate (Hailo 4.23)

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if version already exists in registry"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/frigate

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout homelab-images
        uses: actions/checkout@v4

      - name: Get latest Frigate release
        id: frigate_release
        run: |
          TAG=$(curl -s "https://api.github.com/repos/blakeblackshear/frigate/releases/latest" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r '.tag_name')
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected Frigate release: ${TAG}"

      - name: Resolve tag info
        id: tag_info
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "${BRANCH}" == "main" ]]; then
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            SLUG=$(echo "${BRANCH}" | tr '[:upper:]' '[:lower:]' | tr '/_' '-' | sed 's/[^a-z0-9-]//g')
            echo "tag_suffix=-${SLUG}" >> "$GITHUB_OUTPUT"
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Branch: ${BRANCH}, is_main: $([[ "${BRANCH}" == "main" ]] && echo true || echo false)"

      - name: Check if image tag already exists in GHCR
        id: check_built
        run: |
          VERSION="${{ steps.frigate_release.outputs.version }}"
          SUFFIX="${{ steps.tag_info.outputs.tag_suffix }}"
          FORCE="${{ github.event.inputs.force_build }}"
          IS_MAIN="${{ steps.tag_info.outputs.is_main }}"
          if [[ "${IS_MAIN}" != "true" ]]; then
            echo "Feature branch — always building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://ghcr.io/v2/${{ env.IMAGE_NAME }}/manifests/${VERSION}")
            echo "GHCR manifest status for ${VERSION}: ${HTTP_STATUS}"
            if [[ "${HTTP_STATUS}" == "200" && "${FORCE}" != "true" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up QEMU (multi-arch)
        if: steps.check_built.outputs.skip == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_built.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: steps.check_built.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: steps.check_built.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: frigate
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            FRIGATE_VERSION=${{ steps.frigate_release.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.frigate_release.outputs.version }}${{ steps.tag_info.outputs.tag_suffix }}
            ${{ steps.tag_info.outputs.is_main == 'true' && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME) || '' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frigate NVR with custom Hailo support
            org.opencontainers.image.version=${{ steps.frigate_release.outputs.version }}${{ steps.tag_info.outputs.tag_suffix }}

      - name: Skip notification
        if: steps.check_built.outputs.skip == 'true'
        run: echo "Frigate ${{ steps.frigate_release.outputs.tag }} already built. Skipping."
